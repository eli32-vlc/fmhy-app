name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.29.3

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter=expanded

  android:
    name: Build Android APKs
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          mv dist/app-release.apk dist/fmhy-x-latest.apk 2>/dev/null || true
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: fmhy-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build unsigned iOS IPA
    needs: analyze-test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos/Runner.app"
          test -d "$APP_DIR"
          rm -rf build/ios/ipa_payload
          mkdir -p build/ios/ipa_payload/Payload
          cp -R "$APP_DIR" build/ios/ipa_payload/Payload/Runner.app
          cd build/ios/ipa_payload
          zip -q -r -X "$GITHUB_WORKSPACE/fmhy-x-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh fmhy-x-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: fmhy-ios-unsigned-ipa
          path: fmhy-x-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # Publishes a permanent, public, no-login download on the Releases page.
  # Runs only for version tags; ordinary pushes stay on the Actions artifacts.
  release:
    name: Publish release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -name '*.apk' -exec mv {} release/ \;
          find dist -name '*.ipa' -exec mv {} release/ \;
          ls -lh release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File | Notes |
            | --- | --- | --- |
            | Android | `app-arm64-v8a-release.apk` | Most modern phones |
            | Android | `app-armeabi-v7a-release.apk` | Older 32-bit devices |
            | Android | `app-x86_64-release.apk` | Emulators |
            | iOS | `fmhy-x-unsigned.ipa` | Unsigned - needs signing |

            Android builds are signed with the debug key, so they install
            directly but are not Play Store ready.

            The iOS `.ipa` is unsigned. You must sign it with your own Apple
            developer certificate and provisioning profile before installing,
            for example with `flutter build ipa --export-method development`
            or a tool such as Sideloadly or AltStore.
